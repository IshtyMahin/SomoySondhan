<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — Somoy Sondhan</title>
    <meta name="description" content="Sign in to your Somoy Sondhan account." />
    <meta name="theme-color" content="#0c0f15" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e11d2b'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white'%3E%E0%A6%B8%3C/text%3E%3C/svg%3E"
    />

    <!--
      No external stylesheets on purpose: the design system in
      assets/css/styles.css is self-contained, so the page renders
      identically whether or not a CDN is reachable.
    -->
    <link rel="stylesheet" href="assets/css/styles.css?v=5" />
    <script src="assets/js/theme.js?v=5"></script>
  </head>

  <body>
    <div id="ticker"></div>

    <main class="auth-shell">
      <div class="auth-card">
        <div class="auth-card__head">
          <span class="brand" style="justify-content: center; display: inline-flex; margin-bottom: 1rem">
            <span class="brand__mark" aria-hidden="true">স</span>
            <span class="brand__name">SOMOY <span>SONDHAN</span></span>
          </span>
          <h1>Welcome back</h1>
          <p>Sign in to read, rate and review the day's reporting.</p>
        </div>

        <form id="login-form" novalidate>
          <div class="field">
            <label class="field__label" for="login-username">Username</label>
            <div class="input-wrap">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
              <input
                class="input input--icon"
                type="text"
                id="login-username"
                name="username"
                placeholder="your-username"
                autocomplete="username"
                required
              />
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="login-password">Password</label>
            <div class="input-wrap">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
                <rect x="3" y="11" width="18" height="10" rx="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
              <input
                class="input input--icon"
                type="password"
                id="login-password"
                name="password"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              />
              <button type="button" class="input-wrap__toggle" id="toggle-password" aria-label="Show password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <div id="login-error" class="alert alert--error" role="alert"></div>

          <button type="submit" class="btn btn--primary btn--block btn--lg" id="login-submit">
            Sign in
          </button>
        </form>

        <div class="divider">or</div>

        <p style="text-align: center; margin: 0; font-size: 0.9rem; color: rgb(var(--text-muted))">
          New to Somoy Sondhan?
          <a class="link-underline" href="registration.html">Create an account</a>
        </p>
      </div>
    </main>

    <footer id="site-footer"></footer>

    <div id="loading-spinner"></div>

    <script src="assets/js/core.js?v=5"></script>
    <script src="assets/js/components.js?v=5"></script>
    <script src="assets/js/auth.js?v=5"></script>
    <script src="assets/js/layout-probe.js?v=5"></script>
  </body>
</html>
