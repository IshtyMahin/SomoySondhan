<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account — Somoy Sondhan</title>
    <meta name="description" content="Create your free Somoy Sondhan reader account." />
    <meta name="theme-color" content="#0c0f15" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e11d2b'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white'%3E%E0%A6%B8%3C/text%3E%3C/svg%3E"
    />

    <!--
      No external stylesheets on purpose: the design system in
      assets/css/styles.css is self-contained, so the page renders
      identically whether or not a CDN is reachable.
    -->
    <link rel="stylesheet" href="assets/css/styles.css?v=5" />
    <script src="assets/js/theme.js?v=5"></script>
  </head>

  <body>
    <div id="ticker"></div>

    <main class="auth-shell">
      <div class="auth-card auth-card--wide">
        <div class="auth-card__head">
          <span class="badge badge--outline-brand" style="margin-bottom: 0.75rem">Free account</span>
          <h1>Join Somoy Sondhan</h1>
          <p>Create an account to rate stories, join the discussion and follow your sections.</p>
        </div>

        <form id="register" onsubmit="handleRegistration(event)" novalidate>
          <div class="form-grid form-grid--2">
            <div class="field">
              <label class="field__label" for="first-name">First name</label>
              <input class="input" type="text" id="first-name" name="first_name" placeholder="Rahim" autocomplete="given-name" required />
            </div>
            <div class="field">
              <label class="field__label" for="last-name">Last name</label>
              <input class="input" type="text" id="last-name" name="last_name" placeholder="Uddin" autocomplete="family-name" required />
            </div>
            <div class="field">
              <label class="field__label" for="username">Username</label>
              <input class="input" type="text" id="username" name="username" placeholder="rahim_uddin" autocomplete="username" required />
            </div>
            <div class="field">
              <label class="field__label" for="email">Email</label>
              <input class="input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
            </div>
            <div class="field">
              <label class="field__label" for="password">Password</label>
              <input class="input" type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" required />
            </div>
            <div class="field">
              <label class="field__label" for="confirm-password">Confirm password</label>
              <input class="input" type="password" id="confirm-password" name="confirm_password" placeholder="Repeat your password" autocomplete="new-password" required />
            </div>
          </div>

          <div id="login-error" class="alert alert--error" role="alert"></div>

          <button type="submit" class="btn btn--primary btn--block btn--lg" id="register-submit">
            Create my account
          </button>

          <p style="margin: 0.9rem 0 0; font-size: 0.78rem; color: rgb(var(--text-subtle)); text-align: center">
            We will email you a confirmation link before you can sign in.
          </p>
        </form>

        <div class="divider">or</div>

        <p style="text-align: center; margin: 0; font-size: 0.9rem; color: rgb(var(--text-muted))">
          Already have an account?
          <a class="link-underline" href="login.html">Sign in</a>
        </p>
      </div>
    </main>

    <footer id="site-footer"></footer>

    <div id="loading-spinner"></div>

    <script src="assets/js/core.js?v=5"></script>
    <script src="assets/js/components.js?v=5"></script>
    <script src="assets/js/auth.js?v=5"></script>
  </body>
</html>
