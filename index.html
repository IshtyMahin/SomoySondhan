<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Somoy Sondhan — Truth in every moment</title>
    <meta
      name="description"
      content="Somoy Sondhan — independent reporting, analysis and reader reviews from Bangladesh and beyond."
    />
    <meta name="theme-color" content="#0c0f15" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e11d2b'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white'%3E%E0%A6%B8%3C/text%3E%3C/svg%3E"
    />

    <!--
      No external stylesheets on purpose: the design system in
      assets/css/styles.css is self-contained, so the page renders
      identically whether or not a CDN is reachable.
    -->
    <link rel="stylesheet" href="assets/css/styles.css?v=5" />

    <!-- Theme is applied before first paint, so there is no flash -->
    <script src="assets/js/theme.js?v=5"></script>
  </head>

  <body>
    <!-- Header, mobile drawer and ticker are injected by components.js -->
    <div id="ticker"></div>

    <main class="page" id="news-section">
      <!-- Hero, trending rail and category sections are rendered by articles.js -->
    </main>

    <footer id="site-footer"></footer>

    <!-- Legacy spinner hook; core.js shows a modern top progress bar instead -->
    <div id="loading-spinner"></div>

    <script src="assets/js/core.js?v=5"></script>
    <script src="assets/js/components.js?v=5"></script>
    <script src="assets/js/articles.js?v=5"></script>
    <script src="assets/js/layout-probe.js?v=5"></script>
  </body>
</html>
